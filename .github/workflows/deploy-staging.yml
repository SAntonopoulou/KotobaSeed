name: Deploy staging

# Auto-deploy to demo.kotobaseed.net on every merge to main. Prod
# deploys are tag-gated and live in deploy-prod.yml.
#
# The job waits for CI (lint + tests + frontend build + Playwright)
# to pass on the same SHA before shipping anything.

on:
  # Active: every merge to main auto-deploys to staging after CI passes.
  # Keep workflow_dispatch alongside so we can also kick a manual deploy
  # from the Actions UI when needed (e.g. re-trying after a hiccup).
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI green
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 40
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: '^(Backend lint \+ tests|Frontend build|Playwright e2e)$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20

  deploy:
    name: Rsync + docker compose up
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: always() && (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 25
    environment:
      name: staging
      url: https://demo.kotobaseed.net
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PATH: ${{ vars.STAGING_PATH || '/opt/kotobaseed' }}
      FRONTEND_URL: https://demo.kotobaseed.net
      API_URL: https://api.demo.kotobaseed.net

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Rsync workspace
        run: |
          # CRITICAL: --exclude the server-side-only configuration files
          # so --delete doesn't wipe them. .env carries POSTGRES_PASSWORD,
          # Stripe keys, R2 creds, etc. — none of which are in the repo
          # and all of which kill the stack if missing.
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'frontend/dist' \
            --exclude 'frontend/test-results' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'backend/uploads/' \
            --exclude 'docker-compose.override.yml' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$STAGING_USER@$STAGING_HOST:$STAGING_PATH/"

      - name: Build and restart stack
        run: |
          # Force VITE_API_URL=/api at build time so the frontend bundle
          # hits same-origin (Caddy on staging proxies /api/* → backend).
          # Without this, the build falls back to the docker-compose
          # default `https://api.kotobaseed.net` and the staging frontend
          # would talk to PROD's API, showing prod tutors on demo. Burned
          # by this 2026-06-21.
          #
          # BEERANKED_KEY=stub satisfies docker-compose's required-variable
          # check for the beeranked-agent service. The agent itself isn't
          # part of `up --build backend frontend`, but compose still
          # validates the variable substitution across every service in
          # the file. Staging's .env carries the real key on disk so
          # restart-as-running operations pick it up; the build path
          # alone needs this stub.
          ssh -i ~/.ssh/id_deploy "$STAGING_USER@$STAGING_HOST" \
            "cd $STAGING_PATH && BEERANKED_KEY=stub VITE_API_URL=/api VITE_PLATFORM_APEX=demo.kotobaseed.net docker compose up -d --build backend frontend"

      - name: Wait for backend to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$API_URL/healthz" >/dev/null; then
              echo "Backend up after ${i} probe(s)."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy within 150s" >&2
          exit 1

      - name: Smoke test
        run: ./scripts/smoke_test.sh "$FRONTEND_URL" "$API_URL"
