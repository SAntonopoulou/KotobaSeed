[alembic]
# Migration scripts live in backend/migrations/
script_location = migrations

# Logging config
output_encoding = utf-8
sqlalchemy.url = sqlite:///./database.db
# Real URL is read from env in migrations/env.py — this is just a placeholder
# to satisfy alembic's config loader.

[post_write_hooks]
# Run black formatter on new revision files if installed
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
