# SPA-aware nginx config — every unknown path falls back to index.html so
# React Router handles routing. Static assets keep their fingerprinted
# filenames so they're safe to cache aggressively.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the text-y stuff. nginx-alpine ships gzip on by
    # default; we add the extra types we serve.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # Source maps are emitted by Vite + uploaded to Sentry at build
    # time. Don't serve them to end users — only Sentry needs them and
    # exposing them leaks readable code paths to anyone curious.
    location ~* \.map$ {
        return 404;
    }

    # Hashed asset files (Vite emits names like `chunk-abc123.js`).
    # Long-cache them and skip the SPA fallback rewrite.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Everything else routes through the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching the shell — it references hashed assets, so
        # serving a stale shell breaks freshly-deployed updates.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
