<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KotobaSeed</title>
    <!-- Display + body fonts. Preconnect saves a round-trip on the first
         paint. `display=swap` keeps fallback text visible while the
         web font streams in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Commissioner:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <!--
      Plausible analytics. Self-hosted-friendly, no cookies, GDPR-friendly.
      Replace `kotobaseed.net` with the configured domain in the script tag
      attributes when you wire your own Plausible account.
      Comment out the script to disable. We only ship Plausible on the apex
      since tutor subdomains are individual businesses we don't track.
    -->
    <script
      defer
      data-domain="kotobaseed.net"
      src="https://plausible.io/js/script.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
