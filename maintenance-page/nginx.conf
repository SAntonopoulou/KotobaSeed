server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
        # Don't let intermediaries cache the maintenance page — the
        # moment we're back up, browsers should pick up the live site.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        # 503 so search engines + monitoring know this is intentional
        # (and don't reindex the maintenance page as a real route).
        return 503;
    }

    # Tiny endpoint the page can poll to know when the API is healthy
    # without making cross-origin requests. The page's own server is
    # always up; this is purely for the auto-refresh signal.
    location = /maintenance-heartbeat {
        access_log off;
        return 200 "ok\n";
    }
}
