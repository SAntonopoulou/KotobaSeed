[project]
name = "kotobaseed"
version = "0.1.0"
description = "Kotobaseed — language tutor platform + comprehensible-input marketplace."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
# Rule families: pycodestyle (E/W), Pyflakes (F), isort (I), bugbear (B),
# comprehensions (C4), pyupgrade (UP), simplify (SIM)
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    # Line length — formatter handles it
    "E501",
    # Mutable default in function signature — fine for FastAPI Depends(...)
    "B008",
    # `== True` / `== False` — SQLAlchemy query syntax (where clauses) NEEDS
    # this; rewriting to `is True` / `not column` breaks queries.
    "E712",
    # `!= None` — same story (SQLAlchemy `Column != None` is a SQL filter).
    "E711",
    # `class Foo(str, Enum)` → `class Foo(StrEnum)` — works but changes
    # equality semantics for `.value` callers. Defer until we audit usage.
    "UP042",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Stripe SDK throws DeprecationWarning from pkg_resources; not actionable
    "ignore::DeprecationWarning:stripe",
]
asyncio_mode = "auto"
